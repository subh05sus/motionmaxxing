<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>motionmaxxing</title>
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      try { var t = localStorage.getItem("motionmaxxing:theme"); if (t === "light") document.documentElement.classList.remove("dark"); } catch (e) {}
      try { var m = localStorage.getItem("motionmaxxing:glass"); if (m === "on" || m === "off" || m === "frosted") document.documentElement.dataset.glass = m; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
